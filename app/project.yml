# Xcode プロジェクトの正本。Tendenko.xcodeproj はここから `make app-generate` で生成する (コミットしない)。
name: Tendenko

options:
  bundleIdPrefix: com.yusuke0610
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  TendenkoDomain:
    path: TendenkoDomain
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.29.0

targets:
  Tendenko:
    type: application
    platform: iOS
    sources:
      - path: Tendenko
        excludes:
          - "Resources/fonts/**"
      # フォントグリフ (ADR-0006) はディレクトリ構造を保ったまま同梱する必要があるため
      # folder reference (青いフォルダ) にする。GlyphServer が fontstack サブディレクトリごと参照する。
      - path: Tendenko/Resources/fonts
        type: folder
    dependencies:
      - package: TendenkoDomain
        product: TendenkoDomain
      - package: TendenkoDomain
        product: TendenkoStorage
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusuke0610.tendenko
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # FR-02: 現在地メッシュの地域パッケージを自動 DL するために測位する (発災時の操作ゼロが原則)
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "現在地周辺の避難用地図と経路データを事前に取得するために使用します。"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: 1 # iPhone のみ

  TendenkoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TendenkoTests]
    dependencies:
      - target: Tendenko

schemes:
  Tendenko:
    build:
      targets:
        Tendenko: all
    test:
      targets: [TendenkoTests]
