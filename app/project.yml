# Xcode プロジェクトの正本。Tendenko.xcodeproj はここから `make app-generate` で生成する (コミットしない)。
name: Tendenko

options:
  bundleIdPrefix: com.yusuke0610
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  TendenkoDomain:
    path: TendenkoDomain
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0

targets:
  Tendenko:
    type: application
    platform: iOS
    sources: [Tendenko]
    dependencies:
      - package: TendenkoDomain
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusuke0610.tendenko
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: 1 # iPhone のみ

  TendenkoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TendenkoTests]
    dependencies:
      - target: Tendenko

schemes:
  Tendenko:
    build:
      targets:
        Tendenko: all
    test:
      targets: [TendenkoTests]
